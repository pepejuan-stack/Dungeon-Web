<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon-Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div>
          <h1>Dungeon-Web</h1>
          <p>Encuentra los cristales y sale del calabozo</p>
        </div>
        <div class="stats">
          <span id="health">Vida: 5</span>
          <span id="crystals">Cristales: 0/3</span>
          <span id="status">Estado: jugando</span>
        </div>
      </header>

      <main class="game-panel">
        <div id="game" aria-label="Juego del dungeon" role="application"></div>
      </main>

      <div class="controls">
        <p>Controles: WASD o flechas</p>
        <button id="restartBtn" type="button">Reiniciar</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
